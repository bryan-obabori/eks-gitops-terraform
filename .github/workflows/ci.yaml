name: Project 2 CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"

permissions:
  contents: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod

      - name: Test application
        working-directory: app
        run: go test ./...

      - name: Build application
        working-directory: app
        run: go build -o main .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          platforms: linux/amd64
          tags: bryanobabori/go-web-app:run-${{ github.run_id }}

      - name: Update GitOps image tag
        run: |
          sed -i 's/tag: .*/tag: "run-${{ github.run_id }}"/' gitops/go-web-app-chart/values.yaml

      - name: Commit GitOps image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/go-web-app-chart/values.yaml
          git commit -m "Deploy image run-${{ github.run_id }}"
          git push
